<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Agro-Shield</title>

    <link rel="stylesheet" href="/static/css/style.css" />
    <link rel="stylesheet" href="/static/css/login.css" />
  </head>

  <body>
    <div class="auth-container">
      <div class="auth-left">
        <!-- ======================================================
        AUTH BRANDING

        This logo block gives the login page a polished
        authentication-style header while keeping the layout
        simple and professional.
   ======================================================= -->
        <header class="auth-brand">
          <a class="logo auth-logo-link" href="/" aria-label="Agro-Shield home">
            <img
              src="/static/assets/images/Agro-Shield%20logo.png"
              alt="Agro-Shield logo"
            />
          </a>
        </header>
        <h1>Welcome Back</h1>

        <p>
          Sign in to continue managing your farm, monitor produce, access the
          marketplace, and use AI-powered farming assistance.
        </p>
      </div>

      <div class="auth-right">
        <form id="login-form" method="POST" action="/login">
          <h2>Login</h2>

          {{if .Error}}
          <p class="message" style="color: red">{{.Error}}</p>
          {{end}}

          <label>Phone Number</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter your phone number"
            required
          />

          <label>Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
          />

          <label class="show-password" for="loginShowPassword">
            <input type="checkbox" id="loginShowPassword" />
            Show Password
          </label>

          <button type="submit">Sign In</button>

          <p><a href="/forgot-password">Forgot password?</a></p>

          <p>
            Don't have an account?
            <a href="/register">Create one</a>
          </p>
        </form>
      </div>
    </div>

    <script src="/static/js/password-toggle.js"></script>
    <script src="/static/js/login.js"></script>
  </body>
</html>
